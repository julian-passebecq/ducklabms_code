const code={
retail:{py:`from pyspark.sql import functions as F\n\norders = spark.table("silver.orders")\nsegments = spark.table("silver.dim_customer_segment")\n\nresult = (orders\n    .filter(F.col("net_amount") > 0)\n    .join(segments, "segment_id")\n    .groupBy("customer_id")\n    .agg(\n        F.sum("net_amount").alias("revenue"),\n        F.count("*").alias("orders")\n    ))`,sql:`SELECT customer_id, count(*) AS orders, sum(net_amount) AS revenue\nFROM silver.orders\nWHERE net_amount > 0\nGROUP BY customer_id\nORDER BY orders DESC\nLIMIT 20;`,polars:`import polars as pl\n\norders = pl.scan_parquet("silver/orders/*.parquet")\nresult = (orders\n    .filter(pl.col("net_amount") > 0)\n    .group_by("customer_id")\n    .agg(pl.col("net_amount").sum().alias("revenue"), pl.len().alias("orders")))`},
mobility:{py:`from pyspark.sql import functions as F\nfrom pyspark.sql.window import Window\n\nw = Window.partitionBy("trip_id").orderBy(F.col("loaded_at").desc())\nclean = (spark.table("bronze.trips")\n    .filter(F.col("trip_date") == "2026-09-17")\n    .withColumn("rn", F.row_number().over(w))\n    .filter(F.col("rn") == 1)\n    .drop("rn"))`,sql:`WITH ranked AS (\n  SELECT *, row_number() OVER (PARTITION BY trip_id ORDER BY loaded_at DESC) rn\n  FROM bronze.trips WHERE trip_date = DATE '2026-09-17'\n)\nSELECT * EXCLUDE (rn) FROM ranked WHERE rn = 1;`,polars:`import polars as pl\ntrips = pl.scan_parquet("landing/trips/*.parquet")\nclean = (trips.filter(pl.col("trip_date") == pl.date(2026,9,17))\n    .sort(["trip_id","loaded_at"], descending=[False,True])\n    .unique(subset=["trip_id"], keep="first"))`},
energy:{py:`from pyspark.sql import functions as F\nfrom pyspark.sql.window import Window\n\nsensors = spark.table("silver.dim_sensor")\ntelemetry = spark.table("silver.telemetry")\nw = Window.partitionBy("turbine_id").orderBy("event_ts").rowsBetween(-59,0)\nresult = (telemetry\n    .join(F.broadcast(sensors), "sensor_id")\n    .withColumn("rolling_power", F.avg("power_mw").over(w)))`,sql:`SELECT turbine_id, date_trunc('hour', event_ts) hour, avg(power_mw) avg_power\nFROM silver.telemetry\nWHERE event_date = DATE '2026-09-17'\nGROUP BY ALL;`,polars:`import polars as pl\ntelemetry = pl.scan_parquet("silver/telemetry/event_date=2026-09-17/*.parquet")\nresult = (telemetry\n    .group_by_dynamic("event_ts", every="1h", group_by="turbine_id")\n    .agg(pl.col("power_mw").mean().alias("avg_power")))`},
finance:{py:`from pyspark.sql import functions as F\nfrom pyspark.sql.window import Window\n\nlag_w = Window.partitionBy("account_id").orderBy("transaction_ts")\nrunning_w = (Window.partitionBy("account_id").orderBy("transaction_ts")\n    .rowsBetween(Window.unboundedPreceding, Window.currentRow))\nresult = (spark.table("silver.transactions")\n    .withColumn("previous_amount", F.lag("amount").over(lag_w))\n    .withColumn("running_net", F.sum("amount").over(running_w)))`,sql:`SELECT account_id, transaction_ts, amount,\n  lag(amount) OVER (PARTITION BY account_id ORDER BY transaction_ts) previous_amount,\n  sum(amount) OVER (PARTITION BY account_id ORDER BY transaction_ts ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) running_net\nFROM silver.transactions;`,polars:`import polars as pl\ntx = pl.scan_parquet("silver/transactions/*.parquet")\nresult = tx.sort(["account_id","transaction_ts"]).with_columns(\n  pl.col("amount").shift(1).over("account_id").alias("previous_amount"),\n  pl.col("amount").cum_sum().over("account_id").alias("running_net"))`}
};

function dataItems(){return `<div class="explorer-actions"><button>＋ Add data items</button><button>⌕</button></div><label class="case-inline"><span>Case study</span><select id="caseSel">${Object.values(cases).map(x=>`<option value="${x.id}" ${x.id===state.caseId?'selected':''}>${x.short}</option>`).join('')}</select></label><div class="tree-section"><div class="tree-root"><span>⌄</span><b class="lake-icon">▣</b><strong>${c().short}Lakehouse</strong><em>pin</em></div><div class="tree-level"><div class="tree-folder"><span>⌄</span><b>□</b><strong>Tables</strong></div>${c().tables.map((t,i)=>`<details class="tree-table" ${i===1?'open':''}><summary><span>▦</span>${t[0]}</summary><div class="field-list">${t[1].map(f=>`<div><span class="type-icon">${['decimal','double'].includes(f[1])?'1.2':['int','bigint'].includes(f[1])?'123':'abc'}</span><span>${f[0]}</span><em>${f[1]}</em></div>`).join('')}</div></details>`).join('')}<details class="tree-files"><summary><span>□</span>Files</summary>${c().filesList.map(f=>`<div class="file-item">↳ ${f}</div>`).join('')}</details></div></div>`}
function resources(){return `<div class="resource-list"><div class="resource-heading">CURRENT MISSION</div><div class="current-mission"><b>${mission()[0]}</b><div><strong>${mission()[2]}</strong><span>${mission()[3]}</span></div></div><div class="resource-heading">MISSIONS</div>${c().missions.map((m,i)=>`<button data-mission="${i}" class="${i===state.mission?'active':''}"><b>${(state.completed[state.caseId]||[]).includes(i)?'OK':m[0]}</b><div><strong>${m[2]}</strong><span>${m[1]} · 40 min</span></div></button>`).join('')}<div class="resource-heading">REFERENCE</div><a>Case architecture</a><a>Spark truth pack</a><a>Expected output contract</a></div>`}
function notebook(){const lang=state.runtime==='PySpark Training'?'PySpark (Python)':state.runtime==='Polars'?'Python (Polars)':'SQL';const status=state.status==='running'?'Running':state.status==='success'?(state.report?.simulation?'Calibrated Spark':'Executed'):state.status==='preview'?'Preview':state.status==='error'?'Failed':'Not run';return `<div class="notebook-canvas"><div class="notebook-heading"><div class="blue-rule"></div><div><h1>${c().short} Notebook</h1><p>${c().dataset}</p></div><div class="heading-badges"><span>${state.runtime}</span><span>${state.cluster}</span></div></div><div class="notebook-meta"><span>Mission ${mission()[0]}</span><strong>${mission()[2]}</strong><i>•</i><span>Intermediate</span><i>•</i><span>40 min</span></div><div class="notebook-cell markdown-cell"><div class="cell-gutter"><span>MD</span></div><div class="markdown-content"><span class="mission-label">MISSION</span><h2>${mission()[2]}</h2><p>${mission()[3]}. Work against the known <b>${c().rows}</b>-row case-study dataset. Produce the required result and inspect the physical Spark consequences separately.</p><div class="mission-contract"><div><b>Semantic target</b><span>Correct grain, schema and values</span></div><div><b>Engineering target</b><span>${c().focus.slice(0,2).join(' · ')}</span></div><div><b>Truth boundary</b><span>${state.runtime==='PySpark Training'?'Safe compile + bounded semantic fixture + calibrated virtual Spark':state.runtime==='SQL (DuckDB)'?'Live bounded SQL when FastAPI is connected; DuckDB preferred with explicit fallback provenance':'Reference preview until its execution adapter is connected'}</span></div></div></div></div><div class="insert-row"><button>＋ Code</button><button>＋ Markdown</button><span></span></div><div class="notebook-cell code-cell ${state.status}"><div class="cell-gutter"><button class="cell-run" id="runCell" ${state.status==='running'?'disabled':''}>${state.status==='running'?'…':'▷'}</button><span>${state.count?`[${state.count}]`:'[ ]'}</span></div><div class="cell-body"><div class="cell-toolbar"><span class="language-pill">${lang}</span><span class="realness-pill">${state.runtime==='PySpark Training'?'SAFE SEMANTICS · CLUSTER SIMULATED':state.runtime==='SQL (DuckDB)'?'BOUNDED SQL · ENGINE REPORTED':'REFERENCE PATH'}</span><div class="cell-toolbar-spacer"></div><span>${status}</span></div><textarea id="codeEditor" spellcheck="false">${esc(state.code)}</textarea>${state.error?`<div class="execution-error"><b>Compile/runtime error</b><span>${esc(state.error)}</span></div>`:''}</div></div>${state.ran?output():`<div class="empty-output"><span>Run the cell to compile submitted code. Calibrated Retail and Finance missions also generate virtual Spark diagnostics and a truth-pack grade.</span></div>`}<div class="insert-row bottom"><button>＋ Code</button><button>＋ Markdown</button><span>V0.12 supports live bounded SQL plus calibrated PySpark missions; scratch-cell orchestration remains intentionally limited.</span></div></div>`}
function output(){const tabs=['Result','Plan','Grade'];const rep=state.report;const grade=rep?.grade;const semantic=rep?.semantic_execution;const calibrated=state.status==='success'&&!!rep?.simulation;const executed=semantic?.status==='executed';const semanticVerified=executed&&semantic?.verified===true;const semanticMismatch=executed&&semantic?.verified===false;let body;if(state.outputTab==='Result'){if(executed){const cols=semantic.columns||[];const rows=semantic.rows||[];body=`<div class="result-banner ${semanticVerified?'verified':semanticMismatch?'mismatch':'preview'}"><b>${semanticVerified?'Bounded semantic execution verified':semanticMismatch?'Bounded semantic execution differs from truth pack':'Bounded semantic execution complete'}</b><span>${esc(semantic.engine)} executed the relational SQL over the ${esc(semantic.dataset_scope)}. ${esc(semantic.message)} The full ${c().rows}-row case-study dataset was not scanned.</span></div><div class="semantic-evidence"><span>REAL EXECUTION</span><b>${semantic.row_count} rows</b><small>${esc(semantic.engine)} · ${semantic.elapsed_ms??0} ms · ${semantic.verification_complete?'full oracle':'preview-only oracle'}</small><small>query ${esc((semantic.query_sha256||'').slice(0,10))} · full ${esc((semantic.result_sha256||'preview-only').slice(0,10))} · preview ${esc((semantic.preview_sha256||'').slice(0,10))}</small></div><div class="expected-output"><span>EXECUTED BOUNDED RESULT</span><div class="result-table"><div class="result-row head">${cols.map(col=>`<span>${esc(col)}</span>`).join('')}</div>${rows.map(row=>`<div class="result-row">${cols.map(col=>`<span>${esc(row[col]??'')}</span>`).join('')}</div>`).join('')}</div></div>`}else{body=`<div class="result-banner ${calibrated?'verified':'preview'}"><b>${calibrated?'Compiled + calibrated Spark simulation':state.apiOnline?'Semantic compile / preview':'Reference preview only'}</b><span>${calibrated?'Spark behavior is calibrated, but this mission has no bounded executable semantic fixture yet.':state.apiOnline?'This mission compiled but has no calibrated result fixture.':'No backend execution occurred. Start FastAPI on 127.0.0.1:8000 for live compilation.'}</span></div><div class="result-withheld"><strong>No executed result rows shown</strong><span>Simulation evidence is intentionally kept separate from real result execution.</span></div>`}}else if(state.outputTab==='Plan'){body=`<div class="plan-output"><div><span>COMPILED TARGET</span><strong>${rep?.compile?.target??'reference_only'}</strong></div><pre>${esc(rep?.compile?.sql??state.code)}</pre>${rep?.compile?.training_plan?`<pre>${esc(JSON.stringify(rep.compile.training_plan,null,2))}</pre>`:''}</div>`}else{body=grade?`<div class="grade-empty"><strong>Truth-pack grade ${grade.overall}/100 · ${grade.pass?'PASS':'REVIEW'}</strong><p>${grade.feedback.map(esc).join('<br>')}</p></div>`:`<div class="grade-empty"><strong>${state.apiOnline?'No calibrated grader':'Reference path only'}</strong><p>${state.apiOnline?'This mission compiled but is not marked complete.':'Connect the SparkLab API for truth-pack grading.'}</p></div>`}return `<div class="cell-output"><div class="output-tabs">${tabs.map(t=>`<button data-output="${t}" class="${state.outputTab===t?'active':''}">${t}</button>`).join('')}<span>${state.apiOnline?'SparkLab API':'reference fallback'}</span></div>${body}${state.runtime==='PySpark Training'?`<div class="spark-output-strip"><div><span>Run</span><strong>${calibrated?'calibrated':state.status}</strong></div><div><span>Semantic</span><strong>${executed?(semanticVerified?'verified':'mismatch'):'n/a'}</strong></div><div><span>Shuffle</span><strong>${rep?.simulation?`~${rep.simulation.shuffle_gb} GB`:'n/a'}</strong></div><div><span>Grade</span><strong>${grade?grade.overall:'n/a'}</strong></div><button data-inspector="Spark UI">Inspect Spark UI -&gt;</button></div>`:''}</div>`}
function overview(){return `<div class="workspace-page"><div class="page-title"><span>Architecture</span><h1>DuckLake Data Engineering Lab</h1><p>Fabric-inspired notebook workflow, real Parquet/DuckLake semantics, and a virtual Spark runtime grounded in known data.</p></div><div class="arch-row"><div class="arch-box"><strong>Parquet case data</strong><span>${c().rows} rows · ${c().files} files</span></div><i class="arch-arrow">→</i><div class="arch-box"><strong>DuckDB / MotherDuck</strong><span>real SQL + statistics</span></div><i class="arch-arrow">→</i><div class="arch-box strong"><strong>DuckLake</strong><span>Bronze · Silver · Gold</span></div><i class="arch-arrow">→</i><div class="arch-box"><strong>Notebook runtime</strong><span>SQL · Polars · PySpark</span></div><i class="arch-arrow">→</i><div class="arch-box warn"><strong>SparkLab</strong><span>stages · AQE · cost</span></div></div><div class="truth-cards"><div class="truth-card real"><strong>REAL</strong><p>Parquet values, schemas, SQL results, Polars results, DuckLake tables and snapshots.</p></div><div class="truth-card sim"><strong>MODELED FROM REAL DATA</strong><p>Spark stages, virtual tasks, shuffle, skew, AQE decisions, spill risk and cluster usage.</p></div><div class="truth-card no"><strong>NOT CLAIMED</strong><p>Exact JVM GC, network transfer, proprietary scheduler internals or exact cloud wall-clock.</p></div></div><div class="case-overview-grid">${Object.values(cases).map(x=>`<div class="${x.id===state.caseId?'active':''}"><span>${x.short}</span><strong>${x.rows}</strong><small>${x.focus.join(' · ')}</small></div>`).join('')}</div></div>`}
function pipeline(){return `<div class="workspace-page"><div class="page-title"><span>Pipeline</span><h1>${c().short} orchestration</h1><p>Airflow-style orchestration coordinates source detection, idempotent ingestion, quality gates, transformation and publishing.</p></div><div class="pipeline-line">${['detect_batch','ingest_bronze','quality_gate','build_silver','dbt_gold','publish_consumer'].map((x,i)=>`<div><div class="${i<3?'done':i===3?'active':'idle'}"><span>${i<3?'✓':i===3?'↻':'○'}</span><strong>${x}</strong><small>${i===3?'current learning task':i<3?'success':'waiting'}</small></div>${i<5?'<i>→</i>':''}</div>`).join('')}</div><div class="three-panel"><div class="info-card"><strong>Idempotency</strong><p>Re-running the same input cannot duplicate business rows.</p></div><div class="info-card"><strong>Backfills</strong><p>Recompute only the impacted business/event partitions.</p></div><div class="info-card"><strong>Evidence</strong><p>Pipeline run → DuckLake snapshot → consumer KPI.</p></div></div></div>`}
function lakehouse(){return `<div class="workspace-page"><div class="page-title"><span>Lakehouse</span><h1>${c().lake}</h1><p>Canonical Parquet-backed DuckLake state used by every notebook runtime.</p></div><div class="lake-columns"><div class="info-card"><strong>Bronze</strong><p>Immutable source fidelity, batch id, source filename and loaded_at.</p></div><div class="info-card"><strong>Silver</strong><p>Typed, deduplicated, conformed and quality checked.</p></div><div class="info-card"><strong>Gold</strong><p>Facts, dimensions, aggregates and consumer contracts.</p></div></div><div class="snapshot-timeline">${[c().snapshot-2,c().snapshot-1,c().snapshot,c().snapshot+1].map(n=>`<div class="${(verified()&&n===c().snapshot+1)||(!verified()&&n===c().snapshot)?'current':''}"><span>#${n}</span><strong>${n===c().snapshot+1?'Notebook commit':n===c().snapshot?'Baseline':'Prior snapshot'}</strong></div>`).join('')}</div></div>`}
function sparkWorkspace(){return `<div class="workspace-page"><div class="page-title"><span>Spark UI</span><h1>${c().short} virtual job diagnostics</h1><p>Distributed behavior is simulated from the case-study truth pack; result semantics stay separate.</p></div>${sparkPanel(false)}</div>`}
function sparkPanel(compact=true){const sim=state.report?.simulation;const calibrated=!!sim;let stages=calibrated?sim.stages.map(x=>[x.name,x.tasks.length,x.workers,`${x.duration_s.toFixed(2)}s`,x.spill_gb]):state.caseId==='retail'&&state.mission===2?[['Parquet scan + filter',286,16,'reference',0],['SortMergeJoin + Exchange',200,16,'reference',0],['Exchange + HashAggregate(customer_id)',225,15,'reference',0]]:[['Reference scan',c().files,8,'reference',0]];const shuffle=sim?.shuffle_gb??(state.caseId==='retail'&&state.mission===2?52.806:c().spark.shuffle);const scanTasks=stages[0]?.[1]??c().spark.partitions;const finalTasks=stages.at(-1)?.[1]??c().spark.partitions;return `<div class="spark-panel ${compact?'compact':''}"><div class="spark-summary-grid"><div class="metric-card"><span>Input</span><strong>${c().spark.input}</strong></div><div class="metric-card"><span>Tasks</span><strong>${scanTasks}→${finalTasks}</strong></div><div class="metric-card"><span>Shuffle</span><strong>~${shuffle} GB</strong></div><div class="metric-card"><span>Skew</span><strong>${c().spark.skew}×</strong></div></div><div class="job-status"><div><span>${calibrated?'SUBMITTED JOB':'REFERENCE MODEL'}</span><strong>${mission()[2]}</strong></div><em class="${calibrated?'':'reference'}">${calibrated?'SIMULATED':'NOT RUN'}</em></div><div class="stage-list">${stages.map((s,i)=>`<div><b>Stage ${i+1}</b><div><strong>${s[0]}</strong><small>${s[1]} tasks · ${s[2]} workers · ${s[3]}</small></div><span>${s[4]?`${s[4]} GB spill`:'no spill'}</span></div>`).join('')}</div>${state.caseId==='retail'?`<div class="aqe-note"><b>${state.mission===3?'SKEW DIAGNOSIS':'JOIN DIAGNOSIS'}</b><span>${state.mission===3?'Known hot customer key creates a 1.656 GB post-shuffle partition; AQE may split it. More workers do not remove the hot key.':'Starter code intentionally omits a broadcast hint. The 6.4 MB dimension is a valid candidate; broadcast removes only the join shuffle.'}</span></div>`:''}${state.caseId==='finance'&&state.mission===2?`<div class="aqe-note"><b>ORDERED WINDOW</b><span>${sim?.plan_decision?.reason||'Rows exchange by account_id and sort by transaction_ts. One hot account must remain co-located; AQE cannot split it across independent window tasks.'}</span></div>`:''}<div class="spark-truth"><b>Truth level</b><span>Submitted code: ${state.apiOnline?'safe AST/relational compile':'not executed'}</span><span>Distributed metrics: ${calibrated?'submitted-code simulation':'pre-engineered reference only'}</span><span>Result rows: real bounded fixture when available; full case-study dataset is not claimed</span></div></div>`}
function consumer(){return `<div class="workspace-page"><div class="page-title"><span>Consumer</span><h1>Evidence KPI verification</h1><p>A thin BI layer proves that Gold is usable and makes upstream incidents visible.</p></div><div class="consumer-kpis">${c().kpis.map((x,i)=>`<div><span>${x[0]}</span><strong>${!verified()&&state.caseId==='mobility'&&i===0?'$4.12M':x[1]}</strong><small class="${!verified()&&state.caseId==='mobility'&&i===0?'bad':verified()?'good':'reference'}">${!verified()&&state.caseId==='mobility'&&i===0?'anomaly':verified()?'verified Gold':'case reference'}</small></div>`).join('')}</div><div class="fake-chart"><div class="chart-axis">Gold KPI trend</div>${[34,47,43,58,66,61,79,74,88,83,94,90].map(h=>`<i style="height:${h}%"></i>`).join('')}</div></div>`}
function missions(){return `<div class="workspace-page"><div class="page-title"><span>Learning path</span><h1>${c().name}</h1><p>Case missions progress from data understanding to production diagnosis.</p></div><div class="mission-grid">${c().missions.map((m,i)=>`<button data-mission="${i}" class="${i===state.mission?'active':''}"><b>${m[0]}</b><span>${m[1]}</span><strong>${m[2]}</strong><small>${m[3]}</small><em>Intermediate · 40 min</em></button>`).join('')}</div></div>`}
function main(){return `<main class="workspace-main">${state.view==='Notebook'?notebook():state.view==='Overview'?overview():state.view==='Pipeline'?pipeline():state.view==='Lakehouse'?lakehouse():state.view==='Spark UI'?sparkWorkspace():state.view==='Consumer'?consumer():missions()}</main>`}
const inspectorTabs=['Spark UI','Compare','Lakehouse','Quality','Cost','Hints'];
function inspector(){return `<aside class="diagnostic-panel"><div class="diagnostic-tabs">${inspectorTabs.map(t=>`<button data-inspector="${t}" class="${state.inspector===t?'active':''}">${t}</button>`).join('')}</div><div class="diagnostic-scroll">${state.inspector==='Spark UI'?sparkPanel(true):state.inspector==='Compare'?compareInspector():state.inspector==='Lakehouse'?lakeInspector():state.inspector==='Quality'?qualityInspector():state.inspector==='Cost'?costInspector():hintInspector()}</div></aside>`}
function compareInspector(){if(state.caseId!=='retail')return `<div class="compare-empty"><strong>Comparison not calibrated yet</strong><p>This case keeps its stage model until its truth pack is validated.</p></div>`;return `<div class="compare-panel"><div class="compare-head"><span>BASELINE VS CURRENT</span><strong>Same semantic result, different physical plan</strong></div><div class="compare-row"><span>Shuffle</span><b>52.8 GB</b><i>-&gt;</i><strong class="good">26.4 GB</strong></div><div class="compare-row"><span>Join</span><b>SortMerge</b><i>-&gt;</i><strong class="good">BroadcastHash</strong></div><div class="compare-row"><span>Cost</span><b>3.091 SCC</b><i>-&gt;</i><strong class="good">1.683 SCC</strong></div><div class="compare-note">Broadcast removes the join shuffle; the customer aggregation still requires an exchange.</div></div>`}
function lakeInspector(){return `<div class="inspector-stack"><div class="inspector-block"><span>Attached item</span><strong>${c().lake}</strong><small>DuckLake · Parquet-backed</small></div><div class="inspector-block"><span>Snapshot</span><strong>#${c().snapshot+(verified()?1:0)}</strong><small>${verified()?'verified mission commit':'case baseline'}</small></div><div class="inspector-table"><span>PHYSICAL STATE</span><div><b>Rows</b><strong>${c().rows}</strong></div><div><b>Files</b><strong>${c().files}</strong></div><div><b>Size</b><strong>${c().size}</strong></div></div><div class="medallion-mini"><div>Bronze</div><i>→</i><div>Silver</div><i>→</i><div>Gold</div></div></div>`}
function qualityInspector(){return `<div class="quality-stack">${[['source_schema','pass'],['business_key','pass'],['case_invariant',verified()?'pass':'warning'],['gold_contract',verified()?'pass':'blocked'],['freshness',verified()?'pass':'warning']].map(x=>`<div><span class="${x[1]}">${x[1]==='pass'?'✓':x[1]==='blocked'?'○':'!'}</span><strong>${x[0]}</strong><small>${x[1]}</small></div>`).join('')}</div>`}
function costInspector(){let isFabric=state.cluster==='Fabric-like F64',isDb=state.cluster==='Databricks-like Jobs';let sim=state.report?.simulation;let cost=state.report?.cost;let scc=cost?.sparklab?.scc??1.683;let eur=cost?.sparklab?.estimated_eur??0.168;let core=sim?.core_hours??0.3133;let util=sim?.cluster_utilization_pct??69.4;let driver=sim?.driver_core_hours??0.0294;return `<div class="cost-stack"><div class="inspector-block"><span>SparkLab</span><strong>${scc} SCC</strong><small>€${eur} training price</small></div><div class="inspector-block"><span>Allocated compute</span><strong>${core} core-hours</strong><small>workers + driver</small></div><div class="inspector-block"><span>Slot utilization</span><strong>${util}%</strong><small>task time / allocated worker time</small></div><div class="inspector-block"><span>Driver</span><strong>${driver} core-hours</strong><small>included in modeled usage</small></div>${isFabric?`<div class="inspector-block"><span>Fabric-like</span><strong>${cost?.fabric_like?.cu_hours??0.1567} CUh</strong><small>not an Azure invoice</small></div>`:''}${isDb?`<div class="inspector-block"><span>Databricks-like</span><strong>${cost?.databricks_like?.dbu_equivalent??0.0394} DBU-eq</strong><small>requires dated DBU price</small></div>`:''}<div class="cost-callout">Optimize <b>shuffle, active compute and utilization</b>. Driver time is included; the fake currency is only a training signal.</div></div>`}
function hintInspector(){return `<div class="hint-stack"><span>MISSION HINTS</span><strong>${mission()[2]}</strong><p>${state.runtime==='PySpark Training'?'Inspect join cardinality and partition boundaries before changing cluster size.':'Keep the semantic transformation correct first; compare Spark behavior separately.'}</p><div><b>1</b>Verify the expected grain.</div><div><b>2</b>Check whether the operation is narrow or wide.</div><div><b>3</b>Use case statistics before optimizing.</div></div>`}
function status(){return `<footer class="status-bar"><span><i class="status-dot ${state.status==='running'?'busy':''}"></i> ${state.status==='running'?'Running':state.status==='success'?'Executed':state.status==='preview'?'Preview / compile':state.status==='error'?'Error':'Ready'}</span><span>${state.runtime}</span><span>${state.cluster}</span><span>${c().lake}</span><span class="status-spacer"></span><span>${state.apiOnline?'API CONNECTED':'REFERENCE FALLBACK'}</span><span>REAL: parser + bounded semantics</span><span>SIMULATED: distributed Spark</span><b>V0.12</b></footer>`}
function render(){document.querySelector('#app').innerHTML=`<div class="fabric-shell">${appHeader()}${ribbon()}<div class="workbench">${rail()}${explorer()}${main()}${inspector()}</div>${status()}</div>`;bind()}
function bind(){document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;render()});document.querySelectorAll('[data-exp]').forEach(b=>b.onclick=()=>{state.explorer=b.dataset.exp;render()});document.querySelectorAll('[data-inspector]').forEach(b=>b.onclick=()=>{state.inspector=b.dataset.inspector;render()});document.querySelectorAll('[data-output]').forEach(b=>b.onclick=()=>{state.outputTab=b.dataset.output;render()});document.querySelectorAll('[data-mission]').forEach(b=>b.onclick=()=>{state.mission=+b.dataset.mission;resetRun();state.code=missionCode();state.view='Notebook';render()});let cs=document.querySelector('#caseSel');if(cs)cs.onchange=e=>{state.caseId=e.target.value;let idx=cases[state.caseId].missions.findIndex(m=>m[1]==='Spark');state.mission=idx>=0?idx:0;state.code=missionCode();resetRun();state.saved=true;render()};let rs=document.querySelector('#runtimeSel');if(rs)rs.onchange=e=>{state.runtime=e.target.value;state.inspector=state.runtime==='PySpark Training'?'Spark UI':state.runtime==='SQL (DuckDB)'||state.runtime==='MotherDuck SQL'?'Lakehouse':'Hints';state.code=missionCode();resetRun();state.saved=true;render()};let cl=document.querySelector('#clusterSel');if(cl)cl.onchange=e=>{state.cluster=e.target.value;resetRun();render()};let run=async()=>{if(state.status==='running')return;state.count+=1;state.saved=true;state.error=null;state.report=null;state.ran=true;state.inspector=state.runtime==='PySpark Training'?'Spark UI':state.runtime==='SQL (DuckDB)'?'Lakehouse':state.inspector;if(state.runtime==='Polars'||state.runtime==='MotherDuck SQL'){state.status='preview';render();return}state.status='running';activeController=new AbortController();render();try{let isSql=state.runtime==='SQL (DuckDB)';let url=isSql?'http://127.0.0.1:8000/sql/run':'http://127.0.0.1:8000/notebook/run';let body=isSql?{sql:state.code,case:state.caseId,semantic_engine:'auto',limit:50}:{code:state.code,case:state.caseId,exercise_id:exerciseId(),cluster_profile:clusterProfile(),aqe_enabled:true,force_no_broadcast:false};let response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},signal:activeController.signal,body:JSON.stringify(body)});let payload=await response.json().catch(()=>null);if(!response.ok)throw new Error(payload?.detail||`Notebook run failed: ${response.status}`);state.apiOnline=true;state.report=payload;state.status=payload.status==='succeeded'&&(payload.simulation||payload.semantic_execution?.status==='executed')?'success':'preview';if(payload.grade?.pass){state.completed[state.caseId]=state.completed[state.caseId]||[];if(!state.completed[state.caseId].includes(state.mission))state.completed[state.caseId].push(state.mission)}}catch(err){if(err?.name==='AbortError'){state.error='Run cancelled';state.status='idle';state.ran=false}else{state.apiOnline=false;state.error=String(err?.message||err);state.status='preview'}}finally{activeController=null;render()}};let rb=document.querySelector('#runAll');if(rb)rb.onclick=run;let rc=document.querySelector('#runCell');if(rc)rc.onclick=run;let stop=document.querySelector('#stopRun');if(stop)stop.onclick=()=>activeController?.abort();let ed=document.querySelector('#codeEditor');if(ed)ed.oninput=e=>{state.code=e.target.value;state.saved=false;resetRun();let save=document.querySelector('.save-state');if(save)save.innerHTML='<i class="dirty"></i>Unsaved changes <span>⌄</span>'}}
render();
</script>
</body></html>
