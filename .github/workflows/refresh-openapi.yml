name: Refresh OpenAPI snapshot

on:
  push:
    branches:
      - codex/ducklake-runtime-consolidation-1
    paths:
      - .github/workflows/refresh-openapi.yml
      - scripts/export-openapi.py

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ducklake-runtime-consolidation-1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: python -m pip install -r requirements.txt
      - run: python scripts/export-openapi.py

      - name: Commit refreshed snapshot
        run: |
          if git diff --quiet -- packages/contracts/openapi.json; then
            echo "OpenAPI snapshot is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/contracts/openapi.json
          git commit -m "Refresh FastAPI OpenAPI snapshot"
          git push origin HEAD:codex/ducklake-runtime-consolidation-1
