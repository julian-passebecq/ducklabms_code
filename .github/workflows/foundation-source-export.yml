name: Foundation pinned source export
on:
  push:
    branches: [codex/modular-root-foundation-pass-1-result]
    paths: [.github/workflows/foundation-source-export.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dee5b0da0fe1cec4a9bd24179fe63cbf46bba7a3
          persist-credentials: false
          fetch-depth: 1
      - name: Export exact source snapshot
        run: |
          test "$(git rev-parse HEAD)" = "dee5b0da0fe1cec4a9bd24179fe63cbf46bba7a3"
          mkdir /tmp/foundation-source
          git archive --format=zip HEAD -o /tmp/foundation-source/baseline-source.zip
          git rev-parse HEAD HEAD^{tree} > /tmp/foundation-source/provenance.txt
          sha256sum /tmp/foundation-source/baseline-source.zip > /tmp/foundation-source/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: foundation-pinned-source
          path: /tmp/foundation-source/
          retention-days: 3
