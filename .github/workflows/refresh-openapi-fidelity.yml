name: Refresh OpenAPI fidelity snapshot

on:
  push:
    branches:
      - codex/ducklake-sparklab-fidelity-pass-1
    paths:
      - .github/workflows/refresh-openapi-fidelity.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ducklake-sparklab-fidelity-pass-1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - run: python scripts/export-openapi.py
      - name: Commit refreshed contract
        run: |
          if git diff --quiet -- packages/contracts/openapi.json; then
            echo "OpenAPI snapshot is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/contracts/openapi.json
          git commit -m "Refresh OpenAPI for DuckLake fidelity API"
          git push origin HEAD:codex/ducklake-sparklab-fidelity-pass-1
