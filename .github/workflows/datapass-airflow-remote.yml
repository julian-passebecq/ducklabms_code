name: Datapass Airflow remote

on:
  push:
    branches:
      - codex/airflow-github-actions-1
    paths:
      - .github/workflows/datapass-airflow-remote.yml
  workflow_dispatch:
    inputs:
      request_id:
        description: Datapass request id
        required: true
        type: string
      dag_id:
        description: Airflow Dag id
        required: true
        type: string
      logical_date:
        description: Logical date
        required: true
        type: string
      dag_source_b64:
        description: Base64 Dag source
        required: true
        type: string

permissions:
  contents: read

jobs:
  schema-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Workflow schema accepted
        run: echo "Datapass Airflow workflow schema accepted"
