name: Datapass Airflow remote

run-name: Datapass Airflow ${{ inputs.request_id || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Datapass request id
        required: true
        type: string
      dag_id:
        description: Airflow Dag id
        required: true
        type: string
      logical_date:
        description: Logical date for airflow dags test
        required: true
        type: string
      dag_source_b64:
        description: Base64 encoded educational Dag source
        required: true
        type: string
  push:
    branches:
      - codex/airflow-github-actions-1
    paths:
      - .github/workflows/datapass-airflow-remote.yml

# The submitted Dag is arbitrary learner code. Do not grant it repository
# permissions, check out repository contents, or expose repository secrets.
permissions: {}

jobs:
  airflow-dag-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      AIRFLOW_HOME: ${{ runner.temp }}/datapass-airflow
      AIRFLOW__CORE__DAGS_FOLDER: ${{ runner.temp }}/datapass-airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      AIRFLOW_VERSION: "3.3.2"
      REQUEST_ID_INPUT: ${{ inputs.request_id }}
      DAG_ID_INPUT: ${{ inputs.dag_id }}
      LOGICAL_DATE_INPUT: ${{ inputs.logical_date }}
      DAG_SOURCE_B64_INPUT: ${{ inputs.dag_source_b64 }}

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Airflow
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          PYTHON_VERSION="$(python -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
          CONSTRAINT_URL="https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"
          python -m pip install "apache-airflow==${AIRFLOW_VERSION}" --constraint "${CONSTRAINT_URL}"
          python -m pip check
          airflow version

      - name: Prepare isolated Dag
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${AIRFLOW__CORE__DAGS_FOLDER}"
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          home = Path(os.environ["AIRFLOW_HOME"])
          dags = Path(os.environ["AIRFLOW__CORE__DAGS_FOLDER"])
          dispatched = bool(os.environ.get("DAG_SOURCE_B64_INPUT"))
          request_id = os.environ.get("REQUEST_ID_INPUT") or f"ci-{os.environ['GITHUB_RUN_ID']}"
          dag_id = os.environ.get("DAG_ID_INPUT") or "datapass_ci"
          logical_date = os.environ.get("LOGICAL_DATE_INPUT") or "2026-01-01T00:00:00+00:00"

          if dispatched:
              source = base64.b64decode(os.environ["DAG_SOURCE_B64_INPUT"], validate=True).decode("utf-8")
          else:
              source = """from airflow.sdk import dag, task

          @dag(dag_id="datapass_ci", schedule=None, catchup=False)
          def datapass_ci():
              @task
              def extract():
                  return 2

              @task
              def transform(value: int):
                  assert value == 2
                  return value * 2

              transform(extract())

          datapass_ci()
          """
          if len(source.encode("utf-8")) > 30000:
              raise SystemExit("Dag source exceeds the Datapass 30 KB limit.")

          (dags / "datapass_remote.py").write_text(source, encoding="utf-8")
          (home / "request_id.txt").write_text(request_id, encoding="utf-8")
          (home / "dag_id.txt").write_text(dag_id, encoding="utf-8")
          (home / "logical_date.txt").write_text(logical_date, encoding="utf-8")

          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"request_id={request_id}\n")
              handle.write(f"dag_id={dag_id}\n")
              handle.write(f"logical_date={logical_date}\n")
          PY

      - name: Initialize Airflow metadata
        shell: bash
        run: |
          set -euo pipefail
          airflow db migrate

      - name: Execute real Airflow Dag test
        id: dagtest
        shell: bash
        env:
          DAG_ID: ${{ steps.prepare.outputs.dag_id }}
          LOGICAL_DATE: ${{ steps.prepare.outputs.logical_date }}
        run: |
          set +e
          # User Dag code runs with no configured repository token or OIDC token.
          unset GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          timeout 300s airflow dags test "${DAG_ID}" "${LOGICAL_DATE}" >"${AIRFLOW_HOME}/dag-test.log" 2>&1
          code=$?
          airflow tasks list "${DAG_ID}" >"${AIRFLOW_HOME}/tasks.txt" 2>&1 || true
          echo "exit_code=${code}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Build bounded result artifact
        if: always()
        shell: bash
        env:
          REQUEST_ID: ${{ steps.prepare.outputs.request_id }}
          DAG_ID: ${{ steps.prepare.outputs.dag_id }}
          LOGICAL_DATE: ${{ steps.prepare.outputs.logical_date }}
          DAG_EXIT_CODE: ${{ steps.dagtest.outputs.exit_code || '1' }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          home = Path(os.environ["AIRFLOW_HOME"])
          tasks = []
          tasks_path = home / "tasks.txt"
          if tasks_path.exists():
              tasks = [line.strip() for line in tasks_path.read_text(encoding="utf-8", errors="replace").splitlines() if line.strip()][:200]
          exit_code = int(os.environ["DAG_EXIT_CODE"])
          result = {
              "schema_version": 1,
              "request_id": os.environ["REQUEST_ID"],
              "dag_id": os.environ["DAG_ID"],
              "logical_date": os.environ["LOGICAL_DATE"],
              "status": "success" if exit_code == 0 else "failed",
              "exit_code": exit_code,
              "airflow_version": subprocess.check_output(["airflow", "version"], text=True).strip(),
              "runner": "github-hosted-ubuntu",
              "execution_mode": "airflow dags test",
              "persistent_scheduler": False,
              "tasks": tasks,
          }
          (home / "result.json").write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload Datapass result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: datapass-airflow-${{ steps.prepare.outputs.request_id }}
          path: |
            ${{ env.AIRFLOW_HOME }}/result.json
            ${{ env.AIRFLOW_HOME }}/dag-test.log
            ${{ env.AIRFLOW_HOME }}/tasks.txt
          retention-days: 3
          if-no-files-found: error

      - name: Propagate Dag result
        if: always()
        shell: bash
        env:
          DAG_EXIT_CODE: ${{ steps.dagtest.outputs.exit_code || '1' }}
        run: exit "${DAG_EXIT_CODE}"
