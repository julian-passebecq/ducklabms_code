name: Refresh Airflow OpenAPI snapshot

on:
  push:
    branches:
      - codex/airflow-github-actions-1
    paths:
      - .github/workflows/refresh-airflow-openapi.yml
      - apps/api/datapass/api.py
      - apps/api/datapass/airflow_remote.py

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/airflow-github-actions-1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - run: python scripts/export-openapi.py
      - name: Commit refreshed snapshot
        run: |
          if git diff --quiet -- packages/contracts/openapi.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/contracts/openapi.json
          git commit -m "Refresh OpenAPI for remote Airflow"
          git fetch origin codex/airflow-github-actions-1
          git rebase origin/codex/airflow-github-actions-1
          git push origin HEAD:codex/airflow-github-actions-1
